<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">DroidHand safety layers</title>
<desc id="d">Seven safety layers: ask before acting on the main screen, floating Stop button, background work only while controls are visible, kill switch, debugging off by default, optional Keystore-protected PIN unlock, and an append-only audit and suggestion log.</desc>


<style>
  .flow { stroke-dasharray: 1 11; stroke-linecap: round; animation: dh-flow 1.8s linear infinite; }
  .flow.rev { animation-direction: reverse; }
  .pulse { transform-box: fill-box; transform-origin: center; animation: dh-pulse 2.4s ease-out infinite; }
  .pulse.d2 { animation-delay: 1.2s; }
  .blink { animation: dh-blink 1.1s steps(1) infinite; }
  @keyframes dh-flow { to { stroke-dashoffset: -24; } }
  @keyframes dh-pulse { 0% { transform: scale(.6); opacity: .9; } 100% { transform: scale(1.6); opacity: 0; } }
  @keyframes dh-blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .flow, .pulse, .blink { animation: none; } }
</style>

<defs>
  <linearGradient id="slbg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FBFBFE"/><stop offset="1" stop-color="#ECEEFB"/>
  </linearGradient>
  <radialGradient id="slglowI" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#4F5BD5" stop-opacity="0.35"/><stop offset="1" stop-color="#4F5BD5" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="slglowT" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#0E9F8E" stop-opacity="0.30"/><stop offset="1" stop-color="#0E9F8E" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="slbrand" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4F5BD5"/><stop offset="1" stop-color="#0E9F8E"/>
  </linearGradient>
  <linearGradient id="slmetal" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D3D8F5"/>
  </linearGradient>
  <linearGradient id="slphone" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2B3170"/><stop offset="1" stop-color="#161A40"/>
  </linearGradient>
  <pattern id="sldots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.2" fill="#4F5BD5" fill-opacity="0.07"/>
  </pattern>
  <filter id="slshadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1B2160" flood-opacity="0.18"/>
  </filter>
  <filter id="slsoft" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1B2160" flood-opacity="0.13"/>
  </filter>
</defs>
<rect x="0.5" y="0.5" width="1279" height="659" rx="24" fill="url(#slbg)" stroke="#DADDF2"/><rect x="0.5" y="0.5" width="1279" height="659" rx="24" fill="url(#sldots)"/>
<text x="48" y="62" font-size="12" font-weight="700" letter-spacing="2.2" fill="#0E9F8E">SAFETY</text><text x="48" y="96" font-size="28" font-weight="800" letter-spacing="-0.5" fill="#151839">Seven layers between the agent and your phone</text>
<circle cx="300" cy="392" r="250" fill="url(#slglowI)"/>
<circle cx="300" cy="392" r="222" fill="#FFFFFF" fill-opacity=".55" stroke="#4F5BD5" stroke-opacity=".75" stroke-width="2"/>
<circle cx="300" cy="392" r="198" fill="#FFFFFF" fill-opacity=".55" stroke="#DC3F5E" stroke-opacity=".75" stroke-width="2"/>
<circle cx="300" cy="392" r="174" fill="#FFFFFF" fill-opacity=".55" stroke="#0E9F8E" stroke-opacity=".75" stroke-width="2"/>
<circle cx="300" cy="392" r="150" fill="#FFFFFF" fill-opacity=".55" stroke="#DC3F5E" stroke-opacity=".75" stroke-width="2"/>
<circle cx="300" cy="392" r="126" fill="#FFFFFF" fill-opacity=".55" stroke="#C9870E" stroke-opacity=".75" stroke-width="2"/>
<circle cx="300" cy="392" r="102" fill="#FFFFFF" fill-opacity=".55" stroke="#C9870E" stroke-opacity=".75" stroke-width="2"/>
<circle cx="300" cy="392" r="78" fill="#FFFFFF" fill-opacity=".55" stroke="#4F5BD5" stroke-opacity=".75" stroke-width="2"/>
<circle cx="170.7" cy="226.5" r="10" fill="#4F5BD5"/><text x="170.7" y="230.5" text-anchor="middle" font-size="11" font-weight="800" fill="#FFFFFF">1</text>
<circle cx="185.5" cy="245.4" r="10" fill="#DC3F5E"/><text x="185.5" y="249.4" text-anchor="middle" font-size="11" font-weight="800" fill="#FFFFFF">2</text>
<circle cx="200.3" cy="264.3" r="10" fill="#0E9F8E"/><text x="200.3" y="268.3" text-anchor="middle" font-size="11" font-weight="800" fill="#FFFFFF">3</text>
<circle cx="215.0" cy="283.3" r="10" fill="#DC3F5E"/><text x="215.0" y="287.3" text-anchor="middle" font-size="11" font-weight="800" fill="#FFFFFF">4</text>
<circle cx="229.8" cy="302.2" r="10" fill="#C9870E"/><text x="229.8" y="306.2" text-anchor="middle" font-size="11" font-weight="800" fill="#FFFFFF">5</text>
<circle cx="244.6" cy="321.1" r="10" fill="#C9870E"/><text x="244.6" y="325.1" text-anchor="middle" font-size="11" font-weight="800" fill="#FFFFFF">6</text>
<circle cx="259.4" cy="340.0" r="10" fill="#4F5BD5"/><text x="259.4" y="344.0" text-anchor="middle" font-size="11" font-weight="800" fill="#FFFFFF">7</text>
<circle cx="300" cy="392" r="52" fill="url(#slbrand)"/>
<rect x="283" y="363" width="34" height="58" rx="8" fill="none" stroke="#FFFFFF" stroke-width="3"/>
<rect x="294" y="411" width="12" height="3" rx="1.5" fill="#FFFFFF"/>
<path d="M292,390 l6,6 l11,-12" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="604" y="140" width="628" height="60" rx="14" fill="#FFFFFF" stroke="#DADDF2"/>
<rect x="618" y="150" width="40" height="40" rx="11" fill="#4F5BD5" fill-opacity=".14"/>
<g transform="translate(626,158) scale(1.0)"><path d="M4 5h16v11H9l-5 4z" fill="none" stroke="#4F5BD5" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 9a2 2 0 1 1 2.5 1.9V12M12 14.5h.01" fill="none" stroke="#4F5BD5" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="674" y="166" font-size="15.5" font-weight="700" fill="#151839"><tspan fill="#4F5BD5">1</tspan>  Asks before touching your screen</text>
<text x="674" y="186" font-size="13.5" fill="#4E5478">If you are using the phone, main-screen actions wait for your OK.</text>
<rect x="604" y="210" width="628" height="60" rx="14" fill="#FFFFFF" stroke="#DADDF2"/>
<rect x="618" y="220" width="40" height="40" rx="11" fill="#DC3F5E" fill-opacity=".14"/>
<g transform="translate(626,228) scale(1.0)"><circle cx="12" cy="12" r="9" fill="none" stroke="#DC3F5E" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"/><rect x="9" y="9" width="6" height="6" rx="1" fill="none" stroke="#DC3F5E" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="674" y="236" font-size="15.5" font-weight="700" fill="#151839"><tspan fill="#DC3F5E">2</tspan>  Floating Stop button</text>
<text x="674" y="256" font-size="13.5" fill="#4E5478">One tap cancels whatever the agent is doing right now.</text>
<rect x="604" y="280" width="628" height="60" rx="14" fill="#FFFFFF" stroke="#DADDF2"/>
<rect x="618" y="290" width="40" height="40" rx="11" fill="#0E9F8E" fill-opacity=".14"/>
<g transform="translate(626,298) scale(1.0)"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z" fill="none" stroke="#0E9F8E" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="#0E9F8E" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="674" y="306" font-size="15.5" font-weight="700" fill="#151839"><tspan fill="#0E9F8E">3</tspan>  Visible while it works</text>
<text x="674" y="326" font-size="13.5" fill="#4E5478">Background work only runs while Stop and the window or eye are shown.</text>
<rect x="604" y="350" width="628" height="60" rx="14" fill="#FFFFFF" stroke="#DADDF2"/>
<rect x="618" y="360" width="40" height="40" rx="11" fill="#DC3F5E" fill-opacity=".14"/>
<g transform="translate(626,368) scale(1.0)"><path d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0" fill="none" stroke="#DC3F5E" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="674" y="376" font-size="15.5" font-weight="700" fill="#151839"><tspan fill="#DC3F5E">4</tspan>  Kill switch</text>
<text x="674" y="396" font-size="13.5" fill="#4E5478">Notification, Quick Settings tile, or the agent’s own panic tool.</text>
<rect x="604" y="420" width="628" height="60" rx="14" fill="#FFFFFF" stroke="#DADDF2"/>
<rect x="618" y="430" width="40" height="40" rx="11" fill="#C9870E" fill-opacity=".14"/>
<g transform="translate(626,438) scale(1.0)"><rect x="7" y="8" width="10" height="12" rx="5" fill="none" stroke="#C9870E" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 8v12M4 12h3M17 12h3M5 18l2.5-1.5M19 18l-2.5-1.5M9 5l1 3M15 5l-1 3" fill="none" stroke="#C9870E" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="674" y="446" font-size="15.5" font-weight="700" fill="#151839"><tspan fill="#C9870E">5</tspan>  Debugging off by default</text>
<text x="674" y="466" font-size="13.5" fill="#4E5478">Everything works with debugging off, except the optional own-window helper.</text>
<rect x="604" y="490" width="628" height="60" rx="14" fill="#FFFFFF" stroke="#DADDF2"/>
<rect x="618" y="500" width="40" height="40" rx="11" fill="#C9870E" fill-opacity=".14"/>
<g transform="translate(626,508) scale(1.0)"><circle cx="8" cy="15" r="4" fill="none" stroke="#C9870E" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 12l9-9M17 6l3 3" fill="none" stroke="#C9870E" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="674" y="516" font-size="15.5" font-weight="700" fill="#151839"><tspan fill="#C9870E">6</tspan>  Optional PIN unlock</text>
<text x="674" y="536" font-size="13.5" fill="#4E5478">Off by default. PIN sealed in Android Keystore; off after one wrong try.</text>
<rect x="604" y="560" width="628" height="60" rx="14" fill="#FFFFFF" stroke="#DADDF2"/>
<rect x="618" y="570" width="40" height="40" rx="11" fill="#4F5BD5" fill-opacity=".14"/>
<g transform="translate(626,578) scale(1.0)"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01" fill="none" stroke="#4F5BD5" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="674" y="586" font-size="15.5" font-weight="700" fill="#151839"><tspan fill="#4F5BD5">7</tspan>  Audit + suggestion log</text>
<text x="674" y="606" font-size="13.5" fill="#4E5478">Every action is logged append-only; missing features become suggestions.</text>
</svg>
