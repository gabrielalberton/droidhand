<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">DroidHand architecture</title>
<desc id="d">AI agent talks MCP over stdio to a per-session MCP adapter, which uses the relay daemon on a home server (with an append-only audit log). The DroidHand app on the phone dials out to the relay over a WebSocket on Tailscale or LAN, and drives the phone's apps through its accessibility service.</desc>


<style>
  .flow { stroke-dasharray: 1 11; stroke-linecap: round; animation: dh-flow 1.8s linear infinite; }
  .flow.rev { animation-direction: reverse; }
  .pulse { transform-box: fill-box; transform-origin: center; animation: dh-pulse 2.4s ease-out infinite; }
  .pulse.d2 { animation-delay: 1.2s; }
  .blink { animation: dh-blink 1.1s steps(1) infinite; }
  @keyframes dh-flow { to { stroke-dashoffset: -24; } }
  @keyframes dh-pulse { 0% { transform: scale(.6); opacity: .9; } 100% { transform: scale(1.6); opacity: 0; } }
  @keyframes dh-blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .flow, .pulse, .blink { animation: none; } }
</style>

