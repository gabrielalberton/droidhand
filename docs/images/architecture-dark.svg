<text x="480" y="526" font-size="13" fill="#A6ACD9">results: UI tree, screenshots, events</text>
<rect x="848" y="518" width="22" height="6" rx="3" fill="#F5B841"/>
<text x="880" y="526" font-size="13" fill="#A6ACD9">USB / wireless debugging stays off</text>
<text x="48" y="566" font-size="12" fill="#6E75AE">Every call goes through the relay and lands in the audit log; the app on the phone enforces its own safety rules (ask first, Stop, kill switch).</text>
