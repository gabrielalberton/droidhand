<text x="790.0" y="212" text-anchor="middle" font-size="11" font-weight="700" fill="#EEF0FF">WebSocket</text>
<text x="790.0" y="284" text-anchor="middle" font-size="11" font-weight="600" fill="#A6ACD9">Tailscale</text>
<text x="790.0" y="299" text-anchor="middle" font-size="11" font-weight="600" fill="#A6ACD9">or LAN</text>
<text x="399.0" y="446" text-anchor="middle" font-size="12.5" fill="#A6ACD9">Any number of agent sessions, each with its own adapter; one always-on relay owns the phone link.</text>
<text x="1030.0" y="446" text-anchor="middle" font-size="12.5" fill="#A6ACD9">The phone dials out — no open port on it.</text>
<rect x="48" y="518" width="22" height="6" rx="3" fill="#7480F5"/>
<text x="80" y="526" font-size="13" fill="#A6ACD9">commands: snapshot, tap, type, swipe…</text>
