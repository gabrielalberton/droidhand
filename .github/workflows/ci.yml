name: CI

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

jobs:
  mcp-server:
    name: MCP server + relay
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Tools reference is up to date
        run: npm run docs:tools -- --check

  android-app:
    name: Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Build debug + release (release is unsigned in CI)
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: droidhand-apks
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 14

  hygiene:
    name: Secrets & personal data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No private keys, keystores or tokens committed
        run: |
          ! git grep -nE 'BEGIN (RSA|OPENSSH|EC|PGP) PRIVATE KEY' -- . || { echo "Private key committed!"; exit 1; }
          ! git ls-files | grep -E '\.(jks|keystore|p12)$|(^|/)keystore\.properties$|(^|/)token$' || { echo "Key material committed!"; exit 1; }
          echo OK
